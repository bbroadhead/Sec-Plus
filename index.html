const explanations={"Technical, managerial, operational and physical controls":"Technical controls use technology, managerial controls establish oversight, operational controls guide people and processes, and physical controls protect facilities. Classify a control by how it works, not just its goal.","Preventive, detective, corrective and compensating controls":"Preventive controls discourage or stop incidents; detective controls identify them; corrective controls restore a secure state. Compensating controls provide alternative protection when the preferred control is impractical.","CIA triad and non-repudiation":"Confidentiality limits disclosure, integrity prevents unauthorized modification, and availability keeps systems accessible. Non-repudiation provides evidence that an action or message originated with a particular party.","Authentication, authorization and accounting":"Authentication establishes identity, authorization determines permitted actions, and accounting records activity. MFA combines factors from different categories, not two passwords.","Zero trust and physical security":"Zero trust assumes no implicit trust based on network location: verify explicitly, apply least privilege, and continually evaluate access. Physical measures include locks, barriers, surveillance and environmental controls.","Encryption, hashing and digital signatures":"Encryption protects confidentiality using keys; hashing creates a one-way digest for integrity checks. Digital signatures use asymmetric cryptography to provide integrity, origin authentication and evidence supporting non-repudiation.","PKI and certificates":"A public key infrastructure manages certificates that bind identities to public keys. Know certificate authorities, certificate chains, expiration, revocation and the distinction between public and private keys.","Nation-state, criminal and insider threats":"Threat actors differ in resources, motivation and access. Nation-state groups may pursue espionage; criminals often seek profit; insiders may act maliciously or make mistakes.","Attack surfaces and threat vectors":"An attack surface is the collection of exposed entry points; a threat vector is a method used to exploit one. Inventory exposed services, identities, endpoints and supply-chain dependencies.","Phishing and social engineering":"Phishing uses deceptive messages; spear phishing is targeted, whaling targets executives, and vishing uses voice calls. Verify requests through an independent channel.","Malware and password attacks":"Ransomware disrupts access to data; trojans masquerade as legitimate software; worms spread independently. Password spraying tries common passwords across many accounts, while credential stuffing reuses stolen pairs.","Web application vulnerabilities":"SQL injection manipulates database queries; cross-site scripting injects code into web content; command injection targets system commands. Validate input and use parameterized queries where appropriate.","Scanning, prioritization and remediation":"Identify assets, scan for weaknesses, validate findings, assess exploitability and business impact, then remediate and rescan. A CVSS score is useful but does not replace environmental risk context.","Segmentation, hardening and patching":"Segmentation limits reachability and lateral movement. Hardening removes unnecessary services and defaults; patch management reduces known exploitable weaknesses.","Cloud, on-premises and hybrid models":"Cloud, on-premises and hybrid designs have different operational responsibilities. Understand shared responsibility, elasticity, multi-tenancy and the security implications of service models.","Network segmentation and secure design":"Separate trust zones using VLANs, firewalls and access rules. Defense in depth combines independent safeguards rather than relying on one perimeter control.","Firewalls, IDS/IPS and secure protocols":"Firewalls enforce traffic policy; IDS detects suspicious activity, while IPS can block it inline. Prefer protected protocols such as SSH, HTTPS and SFTP over cleartext alternatives.","Endpoint, wireless and mobile security":"Use endpoint detection, device management, disk encryption and secure baselines. WPA3 improves wireless protection; separate guest access and protect management interfaces.","Backups, recovery and high availability":"RTO is the target time to restore service; RPO is the maximum acceptable amount of data loss measured in time. Test restores and maintain appropriately isolated backups.","Data classification and retention":"Classify information by sensitivity, apply matching controls, retain it only as required and securely dispose of it. Data minimization reduces exposure.","Logs, SIEM and alert triage":"A SIEM aggregates and correlates events from multiple sources. Validate alert context, determine scope and severity, and distinguish false positives from actionable incidents.","Incident indicators and threat hunting":"Indicators of compromise include unusual logins, malicious hashes and unexpected network traffic. Threat hunting proactively tests hypotheses using telemetry and threat intelligence.","Preparation, detection, containment and recovery":"Incident response typically includes preparation, detection and analysis, containment, eradication, recovery and lessons learned. Select actions that preserve evidence while limiting damage.","Digital forensics and evidence handling":"Document collection, maintain chain of custody, use forensic copies and preserve timestamps. Volatile data may disappear on shutdown, so acquisition order matters.","Access provisioning and least privilege":"Grant access based on role and business need, review it regularly, and promptly revoke it when no longer required. Privileged access deserves additional controls and monitoring.","Automation, vulnerability and change management":"Automate repeatable tasks with safeguards and audit trails. Assess, approve, test and document changes to reduce outages and unintended security gaps.","Policies, standards and procedures":"Policies set organizational direction; standards specify mandatory requirements; procedures give step-by-step instructions; guidelines recommend practices.","Roles, responsibilities and risk appetite":"Senior leadership sets risk direction, data owners make classification decisions, and custodians implement protections. Risk appetite is the amount and type of risk an organization is willing to accept.","Risk assessments and treatment":"Assess likelihood and impact, then choose mitigation, transfer, avoidance or acceptance. Residual risk remains after controls; inherent risk exists before controls.","Third-party and supply-chain risk":"Evaluate suppliers before and during engagements, define security obligations in contracts, and plan for service disruptions or vendor compromise.","Audits, assessments and regulations":"Audits evaluate compliance against requirements; assessments identify control gaps and risks. Evidence, scope and independence matter when interpreting findings.","Security awareness and training":"Tailor training to roles and common threats, reinforce reporting procedures, and measure whether behavior improves over time."};

function lessonMatches(lessons,q){let count=0;let html=lessons.map(l=>{let matches=l.slides.filter(sl=>!q||(l.title+' '+sl.title+' '+sl.preview).toLowerCase().includes(q));if(!matches.length)return '';count+=matches.length;let cards=matches.filter(sl=>sl.preview&&sl.title!=='Objectives'&&sl.preview.length>25);return '<details class="topic"><summary>Lesson '+String(l.lesson).padStart(2,'0')+': '+esc(l.title)+' <span class="pill">'+matches.length+' slides</span></summary><p><a href="'+encodeURI(l.path)+'" target="_blank" rel="noopener">Open original presentation ↗</a></p><p class="muted small">Source-based review cards show brief slide excerpts, not full lesson explanations. Reveal an excerpt, then mark the slide reviewed.</p>'+cards.map(sl=>{let id=l.lesson+'-'+sl.number;return '<div class="review-card"><div class="flex between"><strong>Slide '+sl.number+': '+esc(sl.title)+'</strong><span class="pill">'+(state.reviewed?.[id]?'Reviewed':'To review')+'</span></div><p class="muted small">Recall the key points from this slide before revealing the source excerpt.</p><details><summary>Reveal slide excerpt</summary><p>'+esc(sl.preview)+'</p></details><label><input type="checkbox" '+(state.reviewed?.[id]?'checked':'')+' onchange="markSlideReviewed(\''+id+'\',this.checked,this)"> Reviewed</label></div>'}).join('')+(cards.length?'':'<p class="muted small">No text-rich slide previews in this selection. Open the presentation to study its visuals.</p>')+'</details>'}).join('');return (q?'<p class="muted small">'+count+' matching slides</p>':'')+(html||'<p class="muted">No matching slides. Try another term.</p>')}

['1','Which control type is a security guard at an entrance?',['Physical','Cryptographic','Logical','Application'],0,'A guard is a physical security control.'],

fetch('data/source-questions.json').then(r=>{if(!r.ok)throw Error('questions unavailable');return r.json()}).then(d=>{sourcedBank=(d.questions||[]).filter(q=>Array.isArray(q.options)&&q.options.length===4&&Number.isInteger(q.answer)&&q.answer>=0&&q.answer<4).map(q=>({domain:String(q.domain),text:q.prompt,options:q.options,answer:q.answer,explanation:q.explanation,lesson:q.lesson,slide:q.slide}));questionLoadError=false;if(tab==='quiz'&&!session)render()}).catch(()=>{questionLoadError=true;if(tab==='quiz'&&!session)render()});

function questionStats(){let stats=new Map();(state.history||[]).forEach(r=>(r.answers||[]).forEach(a=>{let key=a.key||questionKey({lesson:a.lesson,slide:a.slide,text:a.question});let item=stats.get(key)||{key,question:a.question,domain:a.domain,lesson:a.lesson,slide:a.slide,total:0,correct:0,lastCorrect:false};item.total++;if(a.correct)item.correct++;item.lastCorrect=!!a.correct;stats.set(key,item)}));return [...stats.values()]}

const KEY='secplus-hub-v1',SESSION_KEY='secplus-active-quiz-v1';let state;try{state=JSON.parse(localStorage.getItem(KEY))||{completed:{},flagged:{},history:[]}}catch{state={completed:{},flagged:{},history:[]}};state.history=Array.isArray(state.history)?state.history:[];state.completed=state.completed||{};state.flagged=state.flagged||{};let tab='dashboard',session=null;try{let saved=JSON.parse(localStorage.getItem(SESSION_KEY));if(saved&&Array.isArray(saved.questions)&&saved.questions.length&&Array.isArray(saved.answers)&&Number.isInteger(saved.index)&&saved.index>=0&&saved.index<saved.questions.length&&saved.questions.every(q=>Array.isArray(q.options)&&q.options.some(o=>o.correct))){session=saved;tab='quiz'}else localStorage.removeItem(SESSION_KEY)}catch{try{localStorage.removeItem(SESSION_KEY)}catch{}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{alert('Local storage unavailable. Export your results before leaving.')}}function saveSession(){try{if(session)localStorage.setItem(SESSION_KEY,JSON.stringify(session));else localStorage.removeItem(SESSION_KEY)}catch{}}function el(id){return document.getElementById(id)}function pct(a,b){return b?Math.round(a/b*100):0}function allSub(){return domains.flatMap(d=>d.topics.flatMap(t=>t[1].map(s=>d.id+'|'+t[0]+'|'+s)))}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function navigate(t){tab=t;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));render()}document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>navigate(b.dataset.tab)));
function dashboard(){let all=allSub(),done=all.filter(x=>state.completed[x]).length,attempts=state.history,latest=attempts.at(-1),reviewed=Object.values(state.reviewed||{}).filter(Boolean).length,reviewable=lessonIndex?lessonIndex.lessons.reduce((n,l)=>n+l.slides.filter(sl=>sl.preview&&sl.title!=='Objectives'&&sl.preview.length>25).length,0):null;return '<h1>Your Security+ command center</h1><p class="muted">Build confidence, track mastery, and focus on what needs attention.</p><div class="grid"><div class="card"><div class="muted">Study progress</div><div class="stat">'+pct(done,all.length)+'%</div><div class="progress"><div class="fill" style="width:'+pct(done,all.length)+'%"></div></div><span class="small muted">'+done+' of '+all.length+' subtopics complete</span></div><div class="card"><div class="muted">Practice sessions</div><div class="stat">'+attempts.length+'</div><span class="small muted">Saved locally</span></div><div class="card"><div class="muted">Latest quiz</div><div class="stat">'+(latest?pct(latest.correct,latest.total)+'%':'—')+'</div><span class="small muted">'+(latest?esc(new Date(latest.date).toLocaleDateString()):'No quizzes yet')+'</span></div><div class="card"><div class="muted">Slides reviewed</div><div class="stat">'+reviewed+'</div><span class="small muted">'+(reviewable===null?'Waiting for lesson index':reviewed+' of '+reviewable+' reviewable slides')+'</span></div></div><div class="card"><h2>Exam domains</h2>'+domains.map(d=>{let a=all.filter(x=>x.startsWith(d.id+'|')),n=a.filter(x=>state.completed[x]).length;return '<div class="between flex"><strong>'+esc(d.id+'. '+d.name)+'</strong><span class="muted small">'+d.weight+'% exam weight · '+n+'/'+a.length+'</span></div><div class="progress"><div class="fill" style="width:'+pct(n,a.length)+'%"></div></div>'}).join('')+'</div><div class="card"><h2>Questions to revisit</h2><p class="muted small">Based on missed answers and repeated attempts, not an estimate of exam readiness.</p>'+questionInsights(5)+'</div>'+readinessPanel()+'<button class="btn primary" onclick="navigate(\'study\')">Continue studying</button> <button class="btn" onclick="navigate(\'quiz\')">Start practice</button>'}
function study(){return '<h1>Study by exam objective</h1><p class="muted">Expand a domain and topic. Mark individual subtopics complete or flag them for review.</p>'+resourceLinks()+lessonLibrary()+domains.map(d=>'<div class="card"><h2>'+esc(d.id+'. '+d.name)+' <span class="pill">'+d.weight+'% of exam</span></h2>'+d.topics.map(t=>{let ids=t[1].map(s=>d.id+'|'+t[0]+'|'+s),complete=ids.every(id=>state.completed[id]),flagged=ids.some(id=>state.flagged[id]);return '<details class="topic"><summary>'+esc(t[0])+' <span class="pill">'+ids.filter(id=>state.completed[id]).length+'/'+ids.length+'</span></summary><div class="flex"><button class="btn small" onclick="setGroup(JSON.parse(decodeURIComponent(\''+encodeURIComponent(JSON.stringify(ids))+'\')),true)">Complete topic</button><button class="btn small" onclick="setGroup(JSON.parse(decodeURIComponent(\''+encodeURIComponent(JSON.stringify(ids))+'\')),false)">Flag topic for review</button></div>'+t[1].map(s=>{let id=d.id+'|'+t[0]+'|'+s,k=encodeURIComponent(id);return '<div class="sub"><div><strong>'+esc(s)+'</strong><p class="muted small">'+esc(explanations[s]||"Review the definition, purpose, and a practical use case.")+'</p></div><div class="flex"><label><input type="checkbox" '+(state.completed[id]?'checked':'')+' onchange="mark(\''+k+'\',\'completed\',this.checked)"> Done</label><label><input type="checkbox" '+(state.flagged[id]?'checked':'')+' onchange="mark(\''+k+'\',\'flagged\',this.checked)"> Review</label></div></div>'}).join('')+'<div class="tip"><strong>Exam tip:</strong> Practice applying '+esc(t[0].toLowerCase())+' to a realistic scenario. Look for words such as <em>best</em>, <em>first</em>, and <em>most secure</em>; eliminate answers that do not satisfy the stated requirement.</div></details>'}).join('')+'</div>').join('')}
function mark(k,type,val){state[type][decodeURIComponent(k)]=val;save();render()}function setGroup(ids,done){ids.forEach(id=>{state[done?'completed':'flagged'][id]=true});save();render()}
function weakness(){let score={};state.history.forEach(h=>h.answers.forEach(a=>{let x=score[a.domain]||{right:0,total:0};x.total++;if(a.correct)x.right++;score[a.domain]=x}));return Object.keys(score).filter(k=>score[k].total>=2&&pct(score[k].right,score[k].total)<75)}
function quiz(){if(session)return quizActive();let weak=weakness(),available=bank.length+sourcedBank.length,missed=missedKeys(),missedCount=normalizedQuestions().filter(q=>missed.has(questionKey(q))).length,lessonChoices=Array.from(new Set(sourcedBank.map(q=>q.lesson))).sort((a,b)=>a-b);return '<h1>Build a practice quiz</h1><div class="card"><h2>Quiz settings</h2><label>Number of questions <input id="count" type="number" min="1" max="'+available+'" value="10"></label><label>Question pool <select id="pool"><option value="all">All domains</option><option value="missed" '+(!missedCount?'disabled':'')+'>Retry missed questions ('+missedCount+')</option><option value="source" '+(!sourcedBank.length?'disabled':'')+'>Source-based questions ('+sourcedBank.length+')</option>'+lessonChoices.map(n=>'<option value="lesson-'+n+'">Lesson '+String(n).padStart(2,'0')+' questions</option>').join('')+'<option value="weak" '+(!weak.length?'disabled':'')+'>Weak areas only ('+weak.length+' domains)</option></select></label><label>Time limit <select id="timer"><option value="0">Untimed</option><option value="60">1 minute per question</option><option value="90">90 seconds per question</option><option value="120">2 minutes per question</option></select></label><label>Answer feedback <select id="feedback"><option value="immediate">After each answer</option><option value="end">After finishing the quiz</option></select></label><p class="muted small">Question bank: '+available+' questions ('+sourcedBank.length+' source-referenced). Weak areas unlock after enough quiz results. Each quiz randomizes questions and answer order; this starter does not yet generate new wording.</p>'+(questionLoadError?'<p class="muted" role="alert">Source-based questions could not be loaded. The starter question bank is still available. Refresh to retry.</p>':'')+'<button class="btn primary" onclick="startQuiz()">Start quiz</button> <button class="btn" onclick="startMockExam()">Start mock exam (all available questions)</button><p class="muted small">Mock exam uses the current bank, 90 seconds per question, and feedback at the end. It is not a full-length official Security+ exam simulation.</p></div>'}
function startMockExam(){let count=normalizedQuestions().length;if(!count){alert('No questions are available yet.');return}el('pool').value='all';el('count').value=count;el('timer').value='90';el('feedback').value='end';startQuiz()}
function startQuiz(){let weak=weakness(),choice=el('pool').value,all=normalizedQuestions(),pool=choice==='missed'?all.filter(q=>missedKeys().has(questionKey(q))):choice==='source'?sourcedBank:choice.startsWith('lesson-')?sourcedBank.filter(q=>q.lesson===Number(choice.slice(7))):choice==='weak'?all.filter(q=>weak.includes(q.domain)):all;if(!pool.length){alert('No questions available for this selection.');return}let count=Math.max(1,Math.min(pool.length,Number(el('count').value)||10));session={questions:shuffle(pool).slice(0,count).map(q=>{let opts=shuffle(q.options.map((text,i)=>({text,correct:i===q.answer})));return {domain:q.domain,text:q.text,options:opts,explanation:q.explanation,lesson:q.lesson,slide:q.slide,key:questionKey(q)}}),answers:[],index:0,feedback:el('feedback').value,locked:false,deadline:Number(el('timer').value)?Date.now()+count*Number(el('timer').value)*1000:null};saveSession();render()}
function quizActive(){let s=session,q=s.questions[s.index],a=s.answers[s.index];return '<div class="flex between"><h1>Practice quiz</h1><span class="pill">Question '+(s.index+1)+' of '+s.questions.length+'</span></div>'+(s.deadline?'<p class="muted" id="quiz-clock" role="timer">Time remaining: '+formatRemaining(s.deadline-Date.now())+'</p>':'')+'<div class="progress"><div class="fill" style="width:'+pct(s.index,s.questions.length)+'%"></div></div><div class="card"><span class="muted small">'+esc(domains.find(d=>d.id===q.domain).name)+'</span><h2>'+esc(q.text)+'</h2>'+q.options.map((o,i)=>'<button class="option '+(a&&a.selected===i?'selected ':'')+(a&&s.feedback==='immediate'?(o.correct?'correct':a.selected===i?'wrong':''):'')+'" '+(a?'disabled':'')+' onclick="answer('+i+')">'+String.fromCharCode(65+i)+'. '+esc(o.text)+'</button>').join('')+(a&&s.feedback==='immediate'?'<div class="tip"><strong>'+(a.correct?'Correct!':'Not quite.')+'</strong> '+esc(q.explanation)+(q.lesson?'<p>'+sourceLink(q)+'</p>':'')+'</div>':'')+'<div class="flex between"><span class="muted small">'+(a?'Answer recorded':'Select an answer to continue')+'</span><button class="btn primary" '+(!a?'disabled':'')+' onclick="nextQuestion()">'+(s.index===s.questions.length-1?'Finish quiz':'Next question')+'</button></div></div>'}
function answer(i){if(!session||session.deadline&&Date.now()>=session.deadline){finishQuiz(true);return}let q=session.questions[session.index];session.answers[session.index]={selected:i,correct:q.options[i].correct};saveSession();render()}function nextQuestion(){if(!session)return;if(session.deadline&&Date.now()>=session.deadline){finishQuiz(true);return}if(!session.answers[session.index])return;if(session.index<session.questions.length-1){session.index++;saveSession();render();return}finishQuiz(false)}
function finishQuiz(timedOut){if(!session)return;let s=session;let answers=s.questions.map((q,i)=>({domain:q.domain,question:q.text,selected:s.answers[i]?q.options[s.answers[i].selected].text:'Not answered',correctAnswer:q.options.find(o=>o.correct).text,correct:!!s.answers[i]?.correct,explanation:q.explanation,lesson:q.lesson,slide:q.slide,key:q.key}));let record={id:Date.now(),date:new Date().toISOString(),total:answers.length,correct:answers.filter(a=>a.correct).length,answers,timedOut:!!timedOut,timed:!!s.deadline};state.history.push(record);save();session=null;saveSession();tab='results';document.querySelectorAll('[data-tab]').forEach(b=>b.classList.remove('active'));render()}
function formatRemaining(ms){let seconds=Math.max(0,Math.ceil(ms/1000));return Math.floor(seconds/60)+':'+String(seconds%60).padStart(2,'0')}
setInterval(()=>{if(!session||!session.deadline)return;let remaining=session.deadline-Date.now();if(remaining<=0){finishQuiz(true);return}let clock=el('quiz-clock');if(clock)clock.textContent='Time remaining: '+formatRemaining(remaining)},1000);
function chart(records){let scores={};records.forEach(r=>r.answers.forEach(a=>{let x=scores[a.domain]||{right:0,total:0};x.total++;if(a.correct)x.right++;scores[a.domain]=x}));return domains.filter(d=>scores[d.id]).map(d=>{let x=scores[d.id],p=pct(x.right,x.total);return '<div class="barrow"><strong class="small">'+esc(d.name)+'</strong><div class="bar" role="img" aria-label="'+p+' percent correct"><span style="width:'+p+'%"></span></div><strong>'+p+'%</strong></div>'}).join('')}
function results(){let r=state.history.at(-1);if(!r)return dashboard();return '<h1>Quiz complete</h1><div class="card"><div class="muted">Overall score</div><div class="stat">'+pct(r.correct,r.total)+'%</div><p>'+r.correct+' correct of '+r.total+' questions</p><h2>Performance by domain</h2><p class="muted small">Green = correct; red = incorrect.</p>'+chart([r])+'</div><div class="card"><h2>Answer review</h2>'+r.answers.map((a,i)=>'<details class="topic"><summary>'+(a.correct?'✓':'✕')+' '+(i+1)+'. '+esc(a.question)+'</summary><p>Your answer: '+esc(a.selected)+'</p><p>Correct answer: <strong>'+esc(a.correctAnswer)+'</strong></p><p class="muted">'+esc(a.explanation)+'</p>'+(a.lesson?'<p>'+sourceLink(a)+'</p>':'')+'</details>').join('')+'</div><button class="btn primary" onclick="navigate(\'quiz\')">Take another quiz</button> <button class="btn" onclick="navigate(\'history\')">View history / export</button>'}
function history(){return '<h1>Quiz history & export</h1><div class="card"><div class="flex between"><h2>Saved sessions</h2><button class="btn primary" onclick="exportCsv()">Export CSV spreadsheet</button></div><p class="muted small">CSV opens in Excel, Google Sheets, and other spreadsheet apps. Data stays on this browser unless exported.</p>'+(state.history.length?state.history.slice().reverse().map(r=>'<div class="sub"><span>'+esc(new Date(r.date).toLocaleString())+'</span><strong>'+pct(r.correct,r.total)+'% ('+r.correct+'/'+r.total+')</strong></div>').join(''):'No quizzes saved yet.')+'</div>'+(state.history.length?'<div class="card"><h2>All-time performance by domain</h2>'+chart(state.history)+'</div>':'')+'<div class="card"><h2>Question-level performance</h2><p class="muted small">Counts include all saved attempts; last-attempt status determines retry eligibility.</p>'+questionInsights(20)+'</div>'+readinessPanel()}
function exportCsv(){let rows=[['Session date','Session ID','Domain','Question','Student answer','Correct answer','Correct','Explanation']];state.history.forEach(r=>r.answers.forEach(a=>rows.push([r.date,r.id,domains.find(d=>d.id===a.domain).name,a.question,a.selected,a.correctAnswer,a.correct?'Yes':'No',a.explanation])));let csv='\uFEFF'+rows.map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');let url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),link=document.createElement('a');link.href=url;link.download='security-plus-quiz-results.csv';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function render(){if(session&&session.deadline&&Date.now()>=session.deadline){finishQuiz(true);return}document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));el('view').innerHTML=tab==='dashboard'?dashboard():tab==='study'?study():tab==='quiz'?quiz():tab==='history'?history():results()}render();
</script></body></html>
